name: Deploy via FTP (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via explicit FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 ftp://ftp.diogoramalho.com.br -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set dns:order inet;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            lcd portal-aulas-ete;
            cd /public_html/ava.dev.diogoramalho.com.br/;
            mirror -R --verbose --delete --parallel=3 --exclude-glob .git* --exclude-glob node_modules/** --exclude-glob .github/** --exclude-glob backend/storage/uploads/**;
            bye
          "
