<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal ETE | Solicitar acesso</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="ete-stripes"><span class="s-y"></span><span class="s-g"></span><span class="s-r"></span></div>
    <main class="ete-auth">
      <section class="ete-auth-brand">
        <img src="assets/logo-ete.png" alt="ETE — Escola Técnica Estadual" class="ete-logo mb-4" />
        <h1 class="display-6 mb-3">Pedido de acesso</h1>
        <p class="fs-5 mb-0" style="max-width: 28rem; opacity: 0.92">
          O cadastro não libera o portal na hora. O professor aprova a solicitação e vincula você a uma turma.
        </p>
      </section>

      <section class="ete-auth-panel">
        <article class="ete-auth-box">
          <h2 class="h3 fw-bold text-ete-primary mb-1">Cadastro do aluno</h2>
          <p class="text-muted mb-4">Preencha os dados. Você recebe o acesso depois da aprovação.</p>

          <div id="cadastroAlert" class="alert d-none" role="alert"></div>

          <form id="cadastroAlunoForm" novalidate>
            <div class="mb-3">
              <label for="nome" class="form-label fw-semibold">Nome completo</label>
              <input type="text" id="nome" class="form-control" placeholder="Digite seu nome completo" autocomplete="name" required />
            </div>
            <div class="mb-3">
              <label for="celular" class="form-label fw-semibold">Celular</label>
              <input type="tel" id="celular" class="form-control" placeholder="(00) 00000-0000" inputmode="numeric" autocomplete="tel" maxlength="15" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="seuemail@exemplo.com" autocomplete="email" required />
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label fw-semibold">Senha</label>
              <input type="password" id="senha" class="form-control" placeholder="Crie uma senha" autocomplete="new-password" minlength="6" required />
            </div>
            <div class="mb-4">
              <label for="confirmacaoSenha" class="form-label fw-semibold">Confirmação de senha</label>
              <input type="password" id="confirmacaoSenha" class="form-control" placeholder="Repita a senha" autocomplete="new-password" minlength="6" required />
            </div>
            <button type="submit" class="btn btn-ete-primary btn-lg w-100 btn-touch">
              <i class="bi bi-send-fill me-2"></i>Enviar solicitação
            </button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">
            Já possui acesso?
            <a href="index.html" class="fw-semibold" style="color: var(--ete-navy)">Entrar</a>
          </p>
        </article>
      </section>
    </main>
    <script src="js/api.js?v=3"></script>
    <script src="js/cadastro-aluno.js?v=3"></script>
  </body>
</html>
