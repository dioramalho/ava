<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Aulas - TDS | Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-ete-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <img src="assets/logo.svg" alt="Logo ETE" class="ete-logo-sm" />
          <div>
            <span class="d-block fw-bold text-ete-primary">Portal de Aulas - TDS</span>
            <small class="text-muted">Escola Técnica Estadual</small>
          </div>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarPortal"
          aria-controls="navbarPortal"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarPortal">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">
            <li class="nav-item">
              <button id="logoutBtn" class="btn btn-outline-danger btn-touch w-100">
                <i class="bi bi-box-arrow-right me-1"></i>Sair
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-md-5">
      <section class="mb-4">
        <article class="card border-0 shadow-sm rounded-4 border-start border-4 border-warning">
          <div class="card-body p-4">
            <h2 class="h4 fw-bold mb-3">📢 Quadro de Recados</h2>
            <ul id="recadosList" class="list-group list-group-flush">
              <li class="list-group-item px-0 text-muted">Carregando recados...</li>
            </ul>
          </div>
        </article>
      </section>

      <section aria-labelledby="disciplinasTitulo">
        <!-- <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <h2 id="disciplinasTitulo" class="h4 fw-bold text-ete-primary mb-0">Disciplinas</h2>
          <div class="d-flex align-items-center gap-2">
            <span class="badge rounded-pill text-bg-primary">TDS 2024 / 2025</span>
            <a href="dashboard-professor.html" class="btn btn-sm btn-outline-primary btn-touch">
              <i class="bi bi-person-workspace me-1"></i>Área do professor
            </a>
          </div>
        </div> -->

        <div id="disciplinasGrid" class="row g-4">
          <div class="col-12">
            <div class="alert alert-light border mb-0">Carregando documentos...</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-center py-4 text-muted small">
      © 2026 Escola Técnica Estadual — Portal de Aulas TDS
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/student.js"></script>
  </body>
</html>
