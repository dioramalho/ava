<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal ETE | Trabalho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="ete-app-shell">
    <div class="ete-stripes"><span class="s-y"></span><span class="s-g"></span><span class="s-r"></span></div>
    <nav class="navbar navbar-expand-lg ete-navbar sticky-top">
      <div class="container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-3" href="dashboard.html">
          <img src="assets/logo-ete.png" alt="ETE — Escola Técnica Estadual" class="ete-logo-nav" />
          <span class="d-none d-md-block fw-bold">Portal de Aulas</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAluno" aria-controls="navAluno" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navAluno">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-1 mt-3 mt-lg-0">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="aluno-aulas.html">Minhas aulas</a></li>
            <li class="nav-item"><a class="nav-link active" href="aluno-trabalhos.html">Trabalhos</a></li>
            <li class="nav-item ms-lg-2"><button id="logoutBtn" class="btn btn-sm btn-outline-light btn-touch">Sair</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container-xxl py-4 py-md-5">
      <section class="ete-page-hero mb-4">
        <p id="trabalhoMeta" class="mb-1 small" style="opacity: 0.85">Carregando...</p>
        <h1 id="trabalhoTitulo" class="h3 fw-bold mb-2">Trabalho</h1>
        <p id="trabalhoData" class="mb-0" style="opacity: 0.9"></p>
      </section>

      <div class="row g-4">
        <div class="col-lg-7">
          <article class="ete-card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 fw-bold text-ete-primary mb-0">Enunciado</h2>
              <span id="trabalhoStatus" class="badge text-bg-warning">Pendente</span>
            </div>
            <p id="trabalhoDescricao" class="mb-3" style="white-space: pre-wrap"></p>
            <div id="trabalhoMaterial"></div>
          </article>
          <article class="ete-card p-4" id="entregaCard">
            <h2 class="h6 fw-bold text-ete-primary mb-3">Sua resposta</h2>
            <form id="entregaForm" class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold" for="observacoes">Observações</label>
                <textarea id="observacoes" class="form-control" rows="5" maxlength="5000" placeholder="Conte o que entregou ou alguma observação, se precisar"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" for="arquivoResposta">Anexo Word ou PDF</label>
                <input id="arquivoResposta" class="form-control" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-ete-primary btn-touch" id="enviarEntrega">Enviar entrega</button>
              </div>
            </form>
          </article>
        </div>
        <div class="col-lg-5">
          <article class="ete-card p-4">
            <h2 class="h6 fw-bold text-ete-primary mb-3">Linha do tempo</h2>
            <div id="linhaTempo"><p class="text-muted mb-0">Carregando...</p></div>
          </article>
        </div>
      </div>
      <a href="aluno-trabalhos.html" class="btn btn-outline-secondary btn-touch mt-4">Voltar aos trabalhos</a>
    </main>
    <footer class="ete-footer py-3 text-center small">Escola Técnica Estadual — Portal de Aulas</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/api.js?v=9"></script>
    <script src="js/session.js?v=9"></script>
    <script src="js/aluno-trabalho.js?v=1"></script>
  </body>
</html>
