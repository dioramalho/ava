<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal ETE | Pedido não aprovado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="ete-stripes"><span class="s-y"></span><span class="s-g"></span><span class="s-r"></span></div>
    <main class="ete-auth">
      <section class="ete-auth-brand">
        <img src="assets/logo-ete.png" alt="ETE — Escola Técnica Estadual" class="ete-logo mb-4" />
        <h1 class="display-6 mb-3">Sem acesso ao portal</h1>
        <p class="fs-5 mb-0" style="max-width: 28rem; opacity: 0.92">
          O pedido de cadastro não foi aprovado. O professor é quem decide a liberação da turma.
        </p>
      </section>

      <section class="ete-auth-panel">
        <article class="ete-auth-box">
          <div class="ete-card p-4 p-md-5 text-center">
            <i class="bi bi-x-circle fs-1 text-danger d-block mb-3"></i>
            <h2 class="h4 fw-bold text-ete-primary mb-2">Pedido não aprovado</h2>
            <p class="text-muted mb-4">
              Entre em contato com o professor da disciplina para entender o motivo e, se for o caso, enviar um novo pedido.
            </p>
            <a href="index.html" class="btn btn-ete-primary btn-touch w-100">Voltar para o login</a>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
