<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Aulas - TDS | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-ete-light d-flex align-items-center min-vh-100">
    <main class="container py-4">
      <section class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <article class="card shadow-sm border-0 rounded-4 p-3 p-md-4">
            <header class="text-center mb-4">
              <img
                src="assets/logo.svg"
                alt="Logo da Escola Técnica Estadual"
                class="ete-logo mb-3"
              />
              <h1 class="h3 fw-bold text-ete-primary mb-1">Portal de Aulas - TDS</h1>
              <p class="text-muted mb-0">Escola Técnica Estadual</p>
            </header>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              Login ou senha inválidos
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Login</label>
                <input
                  type="text"
                  id="username"
                  class="form-control form-control-lg"
                  placeholder="Digite seu login"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <input
                  type="password"
                  id="password"
                  class="form-control form-control-lg"
                  placeholder="Digite sua senha"
                  required
                />
              </div>

              <button type="submit" class="btn btn-ete-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
              </button>
            </form>
          </article>
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
  </body>
</html>
