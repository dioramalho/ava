<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal ETE | Aula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="ete-app-shell">
    <div class="ete-stripes"><span class="s-y"></span><span class="s-g"></span><span class="s-r"></span></div>
    <nav class="navbar navbar-expand-lg ete-navbar sticky-top">
      <div class="container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-3" href="dashboard.html">
          <img src="assets/logo-ete.png" alt="ETE — Escola Técnica Estadual" class="ete-logo-nav" />
          <span class="d-none d-md-block fw-bold">Portal de Aulas</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAluno" aria-controls="navAluno" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navAluno">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-1 mt-3 mt-lg-0">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Início</a></li>
            <li class="nav-item"><a class="nav-link active" href="aluno-aulas.html">Minhas aulas</a></li>
            <li class="nav-item ms-lg-2"><button id="logoutBtn" class="btn btn-sm btn-outline-light btn-touch">Sair</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container-xxl py-4 py-md-5">
      <section class="ete-page-hero mb-4">
        <p id="aulaMeta" class="mb-1 small" style="opacity: 0.85"></p>
        <h1 id="aulaTitulo" class="h3 fw-bold mb-2">Carregando aula...</h1>
        <p class="mb-0" style="opacity: 0.9">Assista aos vídeos e baixe o material desta aula.</p>
      </section>

      <section class="row g-4">
        <div class="col-lg-8">
          <article class="ete-card p-3 p-md-4 mb-4">
            <h2 class="h6 fw-bold text-ete-primary mb-3">Vídeos</h2>
            <div id="aulaVideos">
              <p class="text-muted mb-0">Carregando...</p>
            </div>
          </article>
        </div>
        <div class="col-lg-4">
          <article class="ete-card p-4 h-100">
            <h2 class="h6 fw-bold text-ete-primary mb-3">Arquivos</h2>
            <ul id="aulaArquivos" class="list-unstyled d-grid gap-2 mb-0"></ul>
            <a href="aluno-aulas.html" class="d-inline-block mt-4 fw-semibold" style="color: var(--ete-navy)">Voltar para minhas aulas</a>
          </article>
        </div>
      </section>
    </main>
    <footer class="ete-footer py-3 text-center small">Escola Técnica Estadual — Portal de Aulas</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/student.js"></script>
  </body>
</html>
