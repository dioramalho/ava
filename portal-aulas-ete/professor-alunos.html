<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Aulas - TDS | Gestão de Alunos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-ete-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top py-3">
      <div class="container-fluid container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard-professor.html">
          <img src="assets/logo.svg" alt="Logo ETE" class="ete-logo-sm" />
          <div>
            <span class="d-block fw-bold text-ete-primary">Portal de Aulas - TDS</span>
            <small class="text-muted">Gestão de Alunos</small>
          </div>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarProfessorAlunos"
          aria-controls="navbarProfessorAlunos"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarProfessorAlunos">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">
            <li class="nav-item">
              <a href="dashboard-professor.html" class="btn btn-outline-secondary btn-touch w-100">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard do professor
              </a>
            </li>
            <li class="nav-item">
              <button id="logoutBtn" class="btn btn-outline-danger btn-touch w-100">
                <i class="bi bi-box-arrow-right me-1"></i>Sair
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container-xxl py-4 py-md-5">
      <section class="mb-4">
        <article class="card border-0 shadow-sm rounded-4 border-start border-4 border-warning">
          <div class="card-body p-4">
            <h1 class="h4 fw-bold mb-2">Cadastro de Alunos</h1>
            <p class="mb-0 text-muted">
              Nesta tela o professor pode cadastrar, editar e excluir alunos vinculados às turmas.
            </p>
          </div>
        </article>
      </section>

      <section class="row g-4">
        <div class="col-12 col-xl-4">
          <article class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3"><i class="bi bi-person-plus-fill me-2"></i><span id="formTitle">Novo aluno</span></h2>
              <form id="alunoForm" class="d-grid gap-2">
                <input type="hidden" id="alunoId" />

                <label for="alunoTurma" class="form-label mb-0">Turma</label>
                <select id="alunoTurma" class="form-select" required></select>

                <label for="alunoNome" class="form-label mb-0">Nome do aluno</label>
                <input id="alunoNome" type="text" class="form-control" placeholder="Nome completo" required />

                <label for="alunoEmail" class="form-label mb-0">E-mail</label>
                <input id="alunoEmail" type="email" class="form-control" placeholder="aluno@escola.com" required />

                <label for="alunoMatricula" class="form-label mb-0">Matrícula</label>
                <input id="alunoMatricula" type="text" class="form-control" placeholder="Ex.: TDS2026-001" required />

                <div class="d-flex gap-2 mt-2">
                  <button type="submit" id="saveAlunoBtn" class="btn btn-ete-primary btn-touch flex-fill">Cadastrar aluno</button>
                  <button type="button" id="cancelEditBtn" class="btn btn-outline-secondary btn-touch d-none">Cancelar</button>
                </div>
              </form>
            </div>
          </article>
        </div>

        <div class="col-12 col-xl-8">
          <article class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3"><i class="bi bi-people-fill me-2"></i>Todos os alunos</h2>
              <div id="alunosContainer" class="table-responsive">
                <p class="text-muted mb-0">Carregando alunos...</p>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="text-center py-4 text-muted small">
      © 2026 Escola Técnica Estadual — Gestão de Alunos
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/professor-alunos.js"></script>
  </body>
</html>
